<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jira — Dashboard de movimentações</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230052cc'/%3E%3Cg fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M9 9h14'/%3E%3Cpath d='M9 16h14'/%3E%3Cpath d='M9 23h14'/%3E%3C/g%3E%3Ccircle cx='13' cy='9' r='2.2' fill='white'/%3E%3Ccircle cx='19' cy='16' r='2.2' fill='white'/%3E%3Ccircle cx='13' cy='23' r='2.2' fill='white'/%3E%3C/svg%3E">
    <style>
        :root {
            font-family: Inter, system-ui, Arial, sans-serif;
            color: #e6e6e6;
            background: #1b1f24;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        header {
            background: #23272e;
            border-bottom: 1px solid #343a43;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 4px;
        }

        .sub {
            color: #9aa4b2;
            font-size: 13px;
        }

        main {
            padding: 22px;
        }

        .panel {
            background: #23272e;
            border: 1px solid #343a43;
            border-radius: 9px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }

        input,
        textarea {
            font: inherit;
            border: 1px solid #4a515c;
            border-radius: 6px;
            padding: 10px;
            width: 100%;
            color: #e6e6e6;
            background: #1b1f24;
        }

        .domain {
            flex: 1;
            min-width: 280px;
        }

        .week-nav {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .week-nav .arrow {
            width: 40px;
            height: 42px;
            padding: 0;
            font-size: 18px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .date-field {
            width: 150px;
        }

        .date-field input {
            padding: 10px 8px;
        }

        button,
        .linkbtn {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            background: #0052cc;
            color: white;
            font-weight: 650;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }

        button.secondary {
            background: #343a43;
            color: #e6e6e6;
        }

        #board {
            display: grid;
            gap: 12px;
            align-items: start;
        }

        .day {
            background: #2a2f37;
            border-radius: 9px;
            padding: 12px;
            min-height: 220px;
        }

        .day h2 {
            font-size: 14px;
            margin: 0 0 4px;
        }

        .count {
            font-size: 12px;
            color: #9aa4b2;
            margin-bottom: 12px;
        }

        .card {
            background: #23272e;
            border: 1px solid #343a43;
            border-radius: 7px;
            padding: 11px;
            margin-bottom: 9px;
            box-shadow: 0 1px 2px #00000040;
        }

        .key {
            font-weight: 700;
            color: #4c9aff;
            text-decoration: none;
            font-size: 12px;
        }

        .summary {
            font-size: 13px;
            line-height: 1.4;
            margin: 5px 0 9px;
            overflow-wrap: anywhere;
        }

        .badge {
            display: inline-block;
            background: #1f3a68;
            color: #9dc2ff;
            padding: 3px 7px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .current-status {
            font-size: 11px;
            color: #b6c2d1;
            background: #1b1f24;
            border: 1px solid #343a43;
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 10px;
        }

        .current-status strong {
            color: #4c9aff;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .status-blue-gray {
            background: #4a6785;
        }

        .status-green {
            background: #14892c;
        }

        .status-yellow {
            background: #f6c342;
            color: #1b1f24;
        }

        .status-brown {
            background: #815b3a;
        }

        .status-warm-red {
            background: #d04437;
        }

        .status-red {
            background: #d04437;
        }

        .status-medium-gray {
            background: #6b7686;
        }

        .movements {
            border-left: 2px solid #343a43;
            margin-left: 5px;
            padding-left: 12px;
        }

        .movement {
            position: relative;
            margin-bottom: 12px;
        }

        .movement:last-child {
            margin-bottom: 2px;
        }

        .movement::before {
            content: "";
            position: absolute;
            left: -18px;
            top: 4px;
            width: 8px;
            height: 8px;
            background: #0052cc;
            border-radius: 50%;
        }

        .movement-time {
            color: #9aa4b2;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .transition {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            font-size: 11px;
        }

        .status {
            background: #1b1f24;
            border-radius: 4px;
            padding: 4px 6px;
        }

        .author {
            color: #9aa4b2;
            font-size: 10px;
            margin-top: 4px;
        }

        .meta {
            color: #9aa4b2;
            font-size: 10px;
            margin-top: 10px;
            line-height: 1.5;
        }

        .empty {
            color: #6b7686;
            font-size: 12px;
            padding: 10px 2px;
        }

        #message {
            white-space: pre-wrap;
            color: #ff7a6e;
            margin: 10px 0;
        }

        .stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            color: #b6c2d1;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }

        .hint {
            font-size: 12px;
            color: #9aa4b2;
            line-height: 1.5;
            margin-top: 8px;
        }

        @media(max-width:800px) {
            main {
                padding: 12px;
            }

            header {
                padding: 15px;
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }

        .issue-type-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .weekend-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #b6c2d1;
            cursor: pointer;
            user-select: none;
        }

        .weekend-toggle input {
            width: auto;
            accent-color: #0052cc;
        }

        .loading {
            text-align: center;
            color: #9aa4b2;
            padding: 40px;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #343a43;
            border-top-color: #0052cc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>Jira — movimentações de status</h1>
            <div class="sub" id="headerSub">Carregando...</div>
        </div>
        <button class="secondary" id="openConfig">⚙ Configuração</button>
    </header>

    <main>
        <section class="panel" id="configPanel">
            <h2 style="font-size:16px;margin:0 0 12px">Configuração</h2>
            <div class="row">
                <div class="domain">
                    <label for="url">URL do Jira</label>
                    <input id="url" type="url" placeholder="https://suaempresa.atlassian.net">
                </div>
                <button id="save">Salvar</button>
            </div>
            <div class="hint" id="configHint">Cadastre a URL do seu Jira para começar.</div>
        </section>

        <section class="panel hidden" id="dashboardPanel">
            <div class="row" style="justify-content:space-between;margin-bottom:12px">
                <div>
                    <h2 style="font-size:16px;margin:0 0 5px">Movimentações por dia</h2>
                    <div class="stats" id="stats"></div>
                </div>
                <div class="row">
                    <label class="weekend-toggle" for="hideWeekend">
                        <input type="checkbox" id="hideWeekend" checked>
                        Ocultar sábado e domingo
                    </label>
                    <button class="secondary" id="refresh">Atualizar</button>
                </div>
            </div>

            <div class="row" style="margin-bottom:12px">
                <div class="week-nav">
                    <button class="secondary arrow" id="prevWeek" title="Semana anterior">←</button>
                    <div class="date-field">
                        <label for="startDate">Data inicial (domingo)</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="date-field">
                        <label for="endDate">Data final (sábado)</label>
                        <input type="date" id="endDate">
                    </div>
                    <button class="secondary arrow" id="nextWeek" title="Próxima semana">→</button>
                </div>
            </div>

            <div id="message"></div>
            <div id="board"></div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>

</html>
